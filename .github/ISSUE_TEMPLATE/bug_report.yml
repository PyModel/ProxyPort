name: Bug report
description: Something in ProxyPort doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Don't post your license key, email address or order details, and trim private project names and paths from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: ProxyPort version
      description: Settings → About
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Menu bar app
        - proxyport in the terminal
        - Installing or updating
        - License or activation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a dev server with `npm run dev`
        2. Open ProxyPort from the menu bar
        3. …
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Drag images here, or paste terminal output.
